function formatDateBR(value){
  if(value===null||value===undefined||value==='') return '';
  const raw=String(value).trim();
  // ISO / Google Sheets timestamp
  const iso=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
  // dd/mm/yyyy or dd/mm/yy
  const br=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(br){
    const y=br[3].length===2?'20'+br[3]:br[3];
    return `${br[1].padStart(2,'0')}/${br[2].padStart(2,'0')}/${y}`;
  }
  return raw;
}
function holidayStartDate(value){
  const raw=String(value||'');
  const iso=raw.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return new Date(Number(iso[1]),Number(iso[2])-1,Number(iso[3])).getTime();
  const br=raw.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(br){
    const y=br[3].length===2?2000+Number(br[3]):Number(br[3]);
    return new Date(y,Number(br[2])-1,Number(br[1])).getTime();
  }
  return Number.MAX_SAFE_INTEGER;
}

function setVisualMode(mode){
  const clean=mode==='clean';
  document.body.classList.toggle('clean-mode',clean);
  const btn=document.getElementById('themeToggle');
  if(btn){
    btn.textContent=clean?'☾ Modo dark':'☼ Modo clean';
    btn.title=clean?'Voltar ao modo escuro':'Usar modo clean';
  }
  localStorage.setItem('copastur_visual_mode',mode);
}
function toggleVisualMode(){
  setVisualMode(document.body.classList.contains('clean-mode')?'dark':'clean');
}

function normalizarChave(v){
  return String(v||'')
    .normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'');
}

function temDados(obj){
  return obj && typeof obj === 'object' && Object.values(obj).some(v =>
    Array.isArray(v) ? v.length > 0 : (v && typeof v === 'object' ? temDados(v) : v !== '' && v != null)
  );
}

function valorLinha(row, aliases){
  const keys=Object.keys(row||{});
  for(const alias of aliases){
    const a=normalizarChave(alias);
    const k=keys.find(x=>normalizarChave(x)===a);
    if(k!==undefined && row[k]!=='' && row[k]!=null) return row[k];
  }
  return null;
}

function numero(v){
  if(typeof v==='number') return v;
  if(v==null || v==='') return 0;
  let x=String(v).trim().replace(/R\\$\\s?/g,'');
  if(x.includes(',') && x.includes('.')) x=x.replace(/\\./g,'').replace(',','.');
  else if(x.includes(',')) x=x.replace(',','.');
  const n=Number(x.replace(/[^0-9.-]/g,''));
  return isNaN(n)?0:n;
}

function aplicarBaseGoogle(remote){
  let alterou=false;

  const controle=remote.controle||[];
  const cartoes=remote.cartoes||[];
  const produtos=remote.cartoes_produtos||[];
  const comissoes=remote.comissoes||[];
  const nps=remote.nps||[];
  const pessoas=remote.pessoas||[];
  const metas=remote.metas||[];
  const ticketsBase=remote.tickets||[];

  const meses={
    'julho/2026':'julho',
    'jul/2026':'julho',
    'julho':'julho',
    'agosto/2026':'agosto',
    'ago/2026':'agosto',
    'agosto':'agosto'
  };
  const chaveMes=v=>meses[String(v||'').trim().toLowerCase()] || null;

  // CONTROLE
  if(controle.length){
    const fechado=valorLinha(controle[0],['Último mês fechado','Ultimo mes fechado','Mês fechado','Mes fechado']);
    const parcial=valorLinha(controle[0],['Mês parcial','Mes parcial']);
    if(fechado) D.periodoFechado=String(fechado);
    if(parcial) D.periodoParcial=String(parcial);
    alterou=true;
  }

  // CARTÕES — consolida mensal, Copastur x CopasturCard e qualidade.
  if(cartoes.length){
    const grupos={};
    cartoes.forEach(r=>{
      const mes=chaveMes(valorLinha(r,['Mês','Mes','Competência','Competencia']));
      if(!mes) return;
      const produto=String(valorLinha(r,['Produto','Produto financeiro'])||'Consolidado').toLowerCase();
      grupos[mes] ||= {};
      grupos[mes][produto]=r;
    });

    Object.entries(grupos).forEach(([mes,rows])=>{
      const base=D.cartoes[mes] || {};
      const cons=rows.consolidado || rows['consolidado'];
      const cp=rows.copastur;
      const cc=rows.copasturcard;

      if(cons){
        const trx=numero(valorLinha(cons,['Transações','Transacoes','TRX','Quantidade']));
        const valor=numero(valorLinha(cons,['Valor processado','Valor']));
        const nf=numero(valorLinha(cons,['NF capturadas','NF','NFs']));
        const id=numero(valorLinha(cons,['Identificação %','Identificacao %','Identificação','Identificacao']));
        const conc=numero(valorLinha(cons,['Conciliação %','Conciliacao %','Conciliação','Conciliacao']));
        const sla=numero(valorLinha(cons,['SLA %','SLA']));
        const pend=numero(valorLinha(cons,['Valor pendente de identificação','Pendente de identificação','Pendente']));
        if(trx) base.totalTrx=trx;
        if(valor) base.valor=valor;
        if(nf) base.nf=nf;
        if(id) base.identificacao=id;
        if(conc) base.conciliacao=conc;
        if(sla) base.sla=sla;
        if(pend) base.pendente=pend;
      }
      if(cp){
        const trx=numero(valorLinha(cp,['Transações','Transacoes','TRX','Quantidade']));
        const valor=numero(valorLinha(cp,['Valor processado','Valor']));
        const nf=numero(valorLinha(cp,['NF capturadas','NF','NFs']));
        if(trx) base.copastur=trx;
        if(valor) base.copasturValor=valor;
        if(nf) base.copasturNf=nf;
      }
      if(cc){
        const trx=numero(valorLinha(cc,['Transações','Transacoes','TRX','Quantidade']));
        const valor=numero(valorLinha(cc,['Valor processado','Valor']));
        const nf=numero(valorLinha(cc,['NF capturadas','NF','NFs']));
        const id=numero(valorLinha(cc,['Identificação %','Identificacao %','Identificação','Identificacao']));
        const conc=numero(valorLinha(cc,['Conciliação %','Conciliacao %','Conciliação','Conciliacao']));
        const sla=numero(valorLinha(cc,['SLA %','SLA']));
        if(trx) base.copasturCard=trx;
        if(valor) base.copasturCardValor=valor;
        if(nf) base.copasturCardNf=nf;
        if(id) base.copasturCardIdentificacao=id;
        if(conc) base.copasturCardConciliacao=conc;
        if(sla) base.copasturCardDentroPrazo=sla;
      }
      D.cartoes[mes]=Object.assign({},D.cartoes[mes],base);
      alterou=true;
    });

    const serie=cartoes.map(r=>({
      mes:String(valorLinha(r,['Mês','Mes','Competência','Competencia'])||'').trim(),
      valor:numero(valorLinha(r,['Transações','Transacoes','TRX','Quantidade']))
    })).filter(x=>x.mes && x.valor);
    if(serie.length){
      D.cartoes12m=serie;
      alterou=true;
    }
  }

  // DISTRIBUIÇÃO POR PRODUTO
  if(produtos.length){
    const porMes={};
    produtos.forEach(r=>{
      const mes=chaveMes(valorLinha(r,['Mês','Mes','Competência','Competencia']));
      const pf=String(valorLinha(r,['Produto financeiro','Produto','Tipo'])||'Consolidado');
      if(!mes) return;
      porMes[mes] ||= {};
      porMes[mes][pf]={
        Aéreo:numero(valorLinha(r,['Aéreo'])),
        Hotel:numero(valorLinha(r,['Hotel','Terrestre'])),
        'Locação':numero(valorLinha(r,['Locação','Locacao'])),
        'Serviços':numero(valorLinha(r,['Serviços','Servicos'])),
        'Despesa Direta':numero(valorLinha(r,['Despesa Direta'])),
        'Fraude':numero(valorLinha(r,['Fraude'])),
        'Rodoviário':numero(valorLinha(r,['Rodoviário','Rodoviario']))
      };
    });
    Object.entries(porMes).forEach(([mes,prod])=>{
      if(prod.Consolidado){
        D.cartoes[mes].produtos=prod.Consolidado;
      }
      D.cartoes[mes].produtosPorProduto=prod;
    });
    alterou=true;
  }

  // COMISSÕES
  if(comissoes.length){
    const serie=[];
    comissoes.forEach(r=>{
      const mesTxt=String(valorLinha(r,['Mês','Mes','Competência','Competencia'])||'').trim();
      const mes=chaveMes(mesTxt);
      const emitido=numero(valorLinha(r,['Valor emitido','Emitido','Emissão','Emissao']));
      const recebido=numero(valorLinha(r,['Valor recebido','Recebido']));
      const inad=numero(valorLinha(r,['Inadimplência','Inadimplencia']));
      const qtd=numero(valorLinha(r,['CCPPs em análise','CCPPs em analise']));
      const valAnalise=numero(valorLinha(r,['Valor em análise','Valor em analise']));
      const tickets=numero(valorLinha(r,['Tickets em aberto','Tickets']));
      if(emitido) serie.push({mes:mesTxt,valor:emitido});
      if(mes){
        D.comissoes[mes]=Object.assign({},D.comissoes[mes]||{},{
          emitido:emitido || D.comissoes[mes]?.emitido,
          recebido:recebido || D.comissoes[mes]?.recebido,
          inadimplencia:inad || D.comissoes[mes]?.inadimplencia,
          emAnaliseQtd:qtd || D.comissoes[mes]?.emAnaliseQtd,
          emAnaliseValor:valAnalise || D.comissoes[mes]?.emAnaliseValor,
          tickets:tickets || D.comissoes[mes]?.tickets,
          meta:D.comissoes[mes]?.meta || 1600000
        });
      }
    });
    if(serie.length){ D.comissoes12m=serie; alterou=true; }
  }

  // NPS — exclusivamente Marina Benavente; meta 75.
  const npsMarina=nps.filter(r=>{
    const resp=String(valorLinha(r,['Responsável','Responsavel','Gestão','Gestao'])||'').toLowerCase();
    return resp.includes('marina') && resp.includes('benavente');
  });
  if(npsMarina.length){
    const serie=npsMarina.map(r=>({
      mes:String(valorLinha(r,['Mês','Mes','Competência','Competencia'])||'').trim(),
      valor:numero(valorLinha(r,['NPS','Pontuação','Pontuacao','Resultado'])),
      meta:numero(valorLinha(r,['Meta','Objetivo'])) || 75
    })).filter(x=>x.mes);
    if(serie.length){ D.nps=serie; alterou=true; }
  }

  // PESSOAS
  if(pessoas.length){
    const aniversarios=[],empresa=[],ferias=[];
    pessoas.forEach(r=>{
      const nome=valorLinha(r,['Nome','Colaborador']);
      if(!nome) return;
      const nasc=valorLinha(r,['Data de nascimento','Nascimento','Aniversário','Aniversario']);
      const entrada=valorLinha(r,['Data de entrada','Admissão','Admissao','Entrada']);
      const anos=numero(valorLinha(r,['Anos de empresa','Anos','Tempo de empresa']));
      const fer=valorLinha(r,['Férias','Ferias','Período de férias','Periodo de ferias']);
      const status=String(valorLinha(r,['Status','Situação','Situacao'])||'').toLowerCase();
      if(status.includes('inativ')) return;
      if(nasc) aniversarios.push({nome:String(nome),data:String(nasc)});
      if(entrada && anos) empresa.push({nome:String(nome),data:String(entrada),anos});
      if(fer) ferias.push({nome:String(nome),periodo:String(fer)});
    });
    if(aniversarios.length || empresa.length || ferias.length){
      D.pessoas={aniversarios,empresa,ferias};
      alterou=true;
    }
  }

  // TICKETS — fonte individual por colaborador.
  if(ticketsBase.length){
    const mapa={};
    ticketsBase.forEach(r=>{
      const nome=valorLinha(r,['Colaborador','Nome','Emissor']);
      const qtd=numero(valorLinha(r,['Tickets em aberto','Tickets','Quantidade']));
      if(nome) mapa[String(nome)]=qtd;
    });
    if(Object.keys(mapa).length){
      D.tickets=mapa;
      alterou=true;
    }
  }

  // METAS
  if(metas.length){
    metas.forEach(r=>{
      const area=String(valorLinha(r,['Área','Area','Time'])||'').toLowerCase();
      const ind=String(valorLinha(r,['Indicador','Métrica','Metrica'])||'').toLowerCase();
      const produto=String(valorLinha(r,['Produto','Produto financeiro'])||'').toLowerCase();
      const val=numero(valorLinha(r,['Meta','Valor','Objetivo']));
      if(area.includes('cart') || area.includes('concil')){
        if(ind.includes('ident') && val) D.metasCartoes.identificacao=val;
        if(ind.includes('concil') && val) D.metasCartoes.conciliacao=val;
        if(ind.includes('sla') || ind.includes('prazo')) if(val) D.metasCartoes.sla=val;
      }
    });
    alterou=true;
  }

  // Atualiza o KPI NPS do resumo para o último resultado disponível.
  if(D.nps?.length){
    const ultimo=D.nps[D.nps.length-1];
    D.npsAtual=ultimo.valor;
    D.npsMeta=ultimo.meta || 75;
  }

  if(alterou){
    render();
    updateUI();
    if(typeof setVisualMode==='function') setVisualMode(localStorage.getItem('copastur_visual_mode') || 'dark');
  }

  const st=document.getElementById('dataSourceStatus');
  if(st) st.textContent=alterou ? '● Google Sheets conectado' : '● Google Sheets conectado · base atual';
}
function carregarGoogleSheets(){
  return new Promise((resolve,reject)=>{
    const callback='copasturSheetsCallback_'+Date.now();
    const script=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('timeout'));},10000);
    function cleanup(){
      clearTimeout(timer);
      delete window[callback];
      script.remove();
    }
    window[callback]=(data)=>{
      cleanup();
      try{ aplicarBaseGoogle(data); resolve(data); }catch(e){ reject(e); }
    };
    script.onerror=()=>{cleanup();reject(new Error('erro ao carregar API'));};
    script.src=SHEETS_API+'?callback='+encodeURIComponent(callback);
    document.head.appendChild(script);
  });
}

function canvasLine(canvas, labels, values, opts={}){if(!canvas)return;const c=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;c.width=w*dpr;c.height=h*dpr;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);const pad={l:42,r:18,t:18,b:34};const max=Math.max(...values,opts.max||0)*1.08||1,min=opts.min||0;const x=i=>pad.l+i*(w-pad.l-pad.r)/Math.max(1,values.length-1);const y=v=>h-pad.b-(v-min)/(max-min)*(h-pad.t-pad.b);c.strokeStyle='rgba(255,255,255,.09)';c.lineWidth=1;for(let g=0;g<4;g++){let yy=pad.t+g*(h-pad.t-pad.b)/3;c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke()}c.strokeStyle='#5ec8ff';c.lineWidth=3;c.beginPath();values.forEach((v,i)=>{i?c.lineTo(x(i),y(v)):c.moveTo(x(i),y(v))});c.stroke();values.forEach((v,i)=>{c.fillStyle='#fff';c.beginPath();c.arc(x(i),y(v),4,0,Math.PI*2);c.fill();c.fillStyle='#9fb2c9';c.font='11px Segoe UI';c.textAlign='center';c.fillText(labels[i],x(i),h-12)});if(opts.target!==undefined){c.setLineDash([6,5]);c.strokeStyle='#ffd166';c.beginPath();c.moveTo(pad.l,y(opts.target));c.lineTo(w-pad.r,y(opts.target));c.stroke();c.setLineDash([])}}
function drawNps(){renderTrendSvg(document.getElementById('npsChart'),D.nps.map(x=>x.mes),D.nps.map(x=>x.valor),{min:0,max:100,target:75,suffix:'%'});}

   Serviços:D.cartoes.julho.produtos["Serviços"]-cardProducts["Serviços"],

 };
 if(mode==='copastur'){
   t=D.cartoes.julho.copastur; v=31644542.15; nf=964; p=copasturProducts;
 }else if(mode==='card'){

 }else{
   t=D.cartoes.julho.totalTrx; v=D.cartoes.julho.valor; nf=D.cartoes.julho.nf; p=D.cartoes.julho.produtos;

   <div class="card kpi-card"><h3>NF capturadas</h3><div class="kpi">${num(nf)}</div></div>

 const prodEl=document.getElementById('prodChart');
 if(prodEl){
   const arr=Object.entries(p).filter(([,val])=>val>0).sort((a,b)=>b[1]-a[1]);
   const max=Math.max(...arr.map(x=>x[1]))||1;
   prodEl.innerHTML=arr.map(([k,val])=>`<div class="product-row"><div class="label">${k}</div><div class="product-track"><div class="product-fill" style="width:${(val/max*100).toFixed(2)}%"></div></div><div class="product-value">${num(val)}</div></div>`).join('');
 }

 }
 const leader=Object.entries(x.p).sort((a,b)=>b[1]-a[1])[0];
 elx.innerHTML=`
   <div class="card kpi-card"><h3>Transações</h3><div class="kpi">${num(x.t)}</div><div class="small">${mode==='consolidado'?'Copastur + CopasturCard':mode==='copastur'?'Cartões Copastur':'CopasturCard'}</div></div>
   <div class="card kpi-card"><h3>Valor processado</h3><div class="kpi">${money(x.v)}</div></div>
   <div class="card kpi-card"><h3>NF capturadas</h3><div class="kpi">${num(x.nf)}</div></div>
   <div class="card kpi-card"><h3>Produto líder</h3><div class="kpi">${leader[0]}</div><div class="small">${num(leader[1])} TRX</div></div>

   <div class="card kpi-card"><h3>Conciliação · resultado</h3><div class="kpi">${pct(x.conc)}</div><div class="small">Meta: <strong>${pct(meta.conciliacao)}</strong></div></div>
   <div class="card kpi-card"><h3>Até 7 dias · resultado</h3><div class="kpi">${pct(x.prazo)}</div><div class="small">Meta: <strong>${pct(meta.sla)}</strong></div></div>`;
}
function trend(type,el){
 if(el){const tabs=el.parentElement.querySelectorAll('.tab');tabs.forEach(x=>x.classList.remove('active'));el.classList.add('active')}
 const c=document.getElementById('trendChart'); if(!c)return;
 if(type==='nps'){
   renderTrendSvg(c,D.nps.map(x=>x.mes),D.nps.map(x=>x.valor),{suffix:'%',target:75,max:100});
   return;
 }
 if(type==='cartoes'){
   renderTrendSvg(c,D.cartoes12m.map(x=>x.mes),D.cartoes12m.map(x=>x.valor),{suffix:'',compact:true});
   return;
 }
 if(type==='emissao'){
   renderTrendSvg(c,D.comissoes12m.map(x=>x.parcial?'Ago/26*':x.mes),D.comissoes12m.map(x=>x.valor),{suffix:'',compact:true});
   return;
 }
}
function renderTrendSvg(el,labels,values,opts={}){
 if(!el||!values.length)return;
 const W=1200,H=340,L=62,R=28,T=28,B=58;
 const min=opts.min!==undefined?opts.min:0;
 const rawMax=Math.max(...values,opts.target||0);
 const max=opts.max!==undefined?opts.max:(rawMax*1.12||1);
 const span=(max-min)||1;
 const x=i=>L+i*(W-L-R)/Math.max(1,values.length-1);
 const y=v=>H-B-(v-min)/span*(H-T-B);
 const fmt=v=>{
   if(opts.suffix==='%') return Number(v).toFixed(2).replace('.',',')+'%';
   const n=Number(v);
   if(n>=1000000) return 'R$ '+(n/1000000).toFixed(1).replace('.',',')+' mi';
   if(n>=1000) return 'R$ '+(n/1000).toFixed(0)+' mil';
   return n.toLocaleString('pt-BR');
 };
 const grid=[0,1,2,3].map(g=>{
   const yy=T+g*(H-T-B)/3;
   const val=max-g*(max-min)/3;
   return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="rgba(255,255,255,.10)" stroke-width="1"/><text x="${L-10}" y="${yy+4}" text-anchor="end" fill="#9fb2c9" font-size="12">${fmt(val)}</text>`;
 }).join('');
 const points=values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
 const labelStep=values.length>9?2:1;
 const dots=values.map((v,i)=>{
   const showLabel=(i===0||i===values.length-1||i%labelStep===0);
   const label=showLabel?formatDateBR(labels[i]):'';
   return `<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#fff"/>${showLabel?`<text x="${x(i)}" y="${H-18}" text-anchor="middle" fill="#9fb2c9" font-size="11">${label}</text>`:''}`;
 }).join('');
 const target=opts.target!==undefined?`<line x1="${L}" y1="${y(opts.target)}" x2="${W-R}" y2="${y(opts.target)}" stroke="#ffd166" stroke-width="2" stroke-dasharray="7 6"/><text x="${W-R}" y="${y(opts.target)-8}" text-anchor="end" fill="#ffd166" font-size="12">Meta ${opts.target}${opts.suffix||''}</text>`:'';
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolução"><g>${grid}</g>${target}<polyline points="${points}" fill="none" stroke="#5ec8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function toggleSidebar(){
 const sb=document.querySelector('.sidebar');
 if(!sb)return;
 sb.classList.toggle('collapsed');
 localStorage.setItem('copasturSidebarCollapsed',sb.classList.contains('collapsed')?'1':'0');
}
function restoreSidebar(){
 const sb=document.querySelector('.sidebar');

}

function openModal(type){const m=document.getElementById('modal'),c=document.getElementById('modalContent');m.classList.add('show');if(type==='ia'){c.innerHTML=`<div class="kicker">Explicabilidade</div><h2>Por que este insight?</h2><p>O resumo considera somente indicadores já validados na Camada 2.</p><div class="list"><div class="list-item"><span>Comissões emitidos</span><strong>${money(D.comissoes.julho.emitido)}</strong></div><div class="list-item"><span>Meta de emissão</span><strong>${money(D.comissoes.julho.meta)}</strong></div><div class="list-item"><span>Cartões SLA</span><strong>${pct(D.cartoes.julho.sla)}</strong></div><div class="list-item"><span>Inadimplência</span><strong>${money(D.comissoes.julho.inadimplencia)}</strong></div><div class="list-item"><span>Em análise</span><strong>${num(D.comissoes.julho.emAnaliseQtd)} CCPPs</strong></div></div><div class="callout warn" style="margin-top:18px">A IA não usa diferença entre emissão e recebimento como inadimplência e não cria causas que não estejam sustentadas pelos dados.</div>`}else{c.innerHTML=`<div class="kicker">Navegação</div><h2>Menu da apresentação</h2><div class="grid g2">${slides.map((s,i)=>`<button class="btn" style="text-align:left" onclick="closeModal();go(${i})">${String(i+1).padStart(2,'0')} · ${s[0]}</button>`).join('')}</div>`}}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function startPresentation(ev){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  const overview=document.getElementById('overview');
  const slidesEl=document.getElementById('slides');
  if(!slidesEl){
    alert('Não foi possível carregar as telas da apresentação.');
    return false;
  }
  if(overview) overview.style.display='none';
  slidesEl.style.display='block';

  // A Capa é a Tela 01. O botão "Iniciar apresentação"
  // deve avançar para a primeira tela de conteúdo (Tela 02).
  idx=1;
  const all=document.querySelectorAll('.slide');
  all.forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.querySelectorAll('.side-link').forEach((el,i)=>el.classList.toggle('active',i===idx));
  updateUI();
  requestAnimationFrame(()=>{
    if(typeof cardMode==='function' && idx===3) cardMode('consolidado');
    if(typeof volumeMode==='function' && idx===4) volumeMode('consolidado');
    window.scrollTo(0,0);
  });
  return false;
}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')next();if(e.key==='ArrowLeft'||e.key==='PageUp')prev();if(e.key==='Escape')closeModal();if(e.key.toLowerCase()==='f')toggleFullscreen()});
window.addEventListener('resize',()=>{drawProducts();drawNps();trend('cartoes')});
render(); restoreSidebar();
setVisualMode(localStorage.getItem('copastur_visual_mode') || 'dark');
const startBtn=document.getElementById('startPresentationBtn');
if(startBtn) startBtn.onclick=startPresentation;
carregarGoogleSheets().catch(()=>{

  if(st) st.textContent='● Base local · Google Sheets indisponível';
});
